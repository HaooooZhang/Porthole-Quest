<!doctype html>
<html>

    <meta name="aui-viewport" content="mode=fixed,width=336,height=208,scale=gui,zoom=1,min-zoom=1,max-zoom=1,user-scalable=false">
    <meta name="aui-mouse-events" content="intercept">
    <link rel="stylesheet" href="../css/quest_log.css">
</head>
<body>
<main id="journal-frame">
    <div id="chapter-list">
        <div id="list-heading"></div>

    </div>
    <div id="detail-panel"></div>
</main>
</body>
</html>
